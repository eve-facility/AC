<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --ink:#16212e; --muted:#5d6b7a; --line:#d5dbe2; --accent:#1F4E78; --accent-ink:#fff;
  --st-ok:#4b7f52; --st-new:#d32f2f; --st-doing:#e67e00; --st-hold:#7b3fa0; --st-done:#1565c0;
  --font:"Segoe UI","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; --mono:Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.st-접수{background:var(--st-new)} .st-처리중{background:var(--st-doing)} .st-보류{background:var(--st-hold)} .st-완료{background:var(--st-done)} .st-취소{background:#888}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;z-index:9999;font-size:13px}

/* ---------- dashboard ---------- */
#dash{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.top h1{font-size:19px;margin:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:center;font-size:13px}
.kpi b{font-size:16px;font-variant-numeric:tabular-nums}
.kpi i{width:10px;height:10px;border-radius:50%;display:inline-block}
.spacer{flex:1}
.meta{font-size:12px;color:var(--muted)}
.body{flex:1;min-height:0;display:flex;gap:10px}
#map{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff}
.side{width:340px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.side h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.side .list{overflow:auto;flex:1;min-height:0;padding:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
.item:hover{border-color:var(--accent)}
.item .r1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.item .code{font-family:var(--mono);font-weight:700}
.item .r2{font-size:12.5px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);font-size:13px;padding:12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* map markers */
.mk{display:flex;align-items:center;gap:3px;white-space:nowrap;width:max-content;pointer-events:auto}
.mk .sq{width:13px;height:13px;border-radius:3px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);flex:none}
.mk .mkl{font-family:var(--mono);font-weight:700;font-size:11px;color:#fff;padding:1px 4px;border-radius:3px;line-height:1.2}
.mk.alert .sq{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 0 rgba(211,47,47,.6)}100%{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 12px rgba(211,47,47,0)}}
@media (prefers-reduced-motion:reduce){.mk.alert .sq{animation:none}}
.leaflet-container{font-family:var(--font)}
.pop h3{margin:0 0 4px;font-family:var(--mono);font-size:15px}
.pop .rp{font-size:12.5px;margin:3px 0}

/* admin */
.adm{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.rep{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.rep .hd{display:flex;justify-content:space-between;gap:6px;align-items:center}
.rep .tx{font-size:12.5px;color:var(--ink);margin:6px 0;line-height:1.5}
.rep .tx small{color:var(--muted)}
.rep .ctl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rep input,.rep textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-top:4px}
.rep textarea{min-height:52px;resize:vertical}
.stbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.place{font-size:12.5px}
.place .chip{display:inline-block;font-family:var(--mono);font-weight:700;border:1px solid var(--line);border-radius:6px;padding:3px 7px;margin:2px;cursor:pointer;background:var(--panel)}
.place .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:5000;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;padding:18px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px}
.modal input{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px}
.err{color:var(--st-new);font-size:13px}

/* ---------- report (mobile) ---------- */
#report{max-width:560px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rhead .brand{font-size:13px;color:var(--muted);font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.unit .code{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:.5px}
.unit .sub{color:var(--muted)}
#mini{height:190px;border-radius:8px;border:1px solid var(--line)}
.warn{background:#fff4e5;border:1px solid #f0c27a;border-radius:10px;padding:10px 12px;font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px}
.sym{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 8px;cursor:pointer;font-weight:600;min-height:52px;text-align:center}
.sym button[aria-pressed="true"]{border-color:var(--accent);background:#e7eef6;color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:600}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;background:#fff;color:var(--ink)}
.fld select + input{margin-top:6px}
.fld textarea{min-height:80px;resize:vertical}
.fld .opt{font-weight:400;color:var(--muted)}
.photo img{max-width:100%;border-radius:8px;margin-top:6px}
.submit{min-height:52px;font-size:16px}
.done{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--st-ok);color:#fff;font-size:36px;display:grid;place-items:center}
.done .rid{font-family:var(--mono);font-size:22px;font-weight:800}

/* ---------- label print ---------- */
#labels{display:none}
@media print{
  body.printing #dash,body.printing #report,body.printing .modal{display:none!important}
  body.printing #labels{display:block}
  body.printing{background:#fff}
  @page{size:A4;margin:0}
}
#labels .page{width:210mm;height:297mm;padding:9mm 25mm 0;page-break-after:always}
.lb{width:160mm;height:55mm;border:.3mm dashed #888;display:flex;align-items:center;padding:0 3mm 0 4mm;gap:3mm;overflow:hidden;background:#fff}
.lb+.lb{border-top:none}
.lb .pre{width:27mm;display:flex;flex-direction:column;gap:2mm}
.lb .t{font-size:7.5pt;font-weight:700;color:#fff;background:#1F4E78;padding:1mm 1.6mm;border-radius:1mm;align-self:flex-start;letter-spacing:.6pt}
.lb .p{font-family:"Arial Narrow","DejaVu Sans Condensed",Arial,sans-serif;font-weight:700;font-size:21pt;color:#333}
.lb .num{flex:1;font-family:"Arial Narrow","DejaVu Sans Condensed",Arial,sans-serif;font-weight:700;font-size:44mm;line-height:.8;letter-spacing:-1mm;text-align:center;white-space:nowrap;padding-top:2mm}
.lb .q{width:36mm;display:flex;flex-direction:column;align-items:center;gap:1mm}
.lb .q img{width:34mm;height:34mm;image-rendering:pixelated}
.lb .q span{font-family:var(--mono);font-size:7.5pt;font-weight:700}
@media (max-width:820px){
  .body{flex-direction:column}
  .side{width:auto;max-height:45vh}
  #map{min-height:55vh}
}
</style>
</head>
<body>

<!-- ================= 현황판 ================= -->
<div id="dash" class="hidden">
  <div class="top">
    <h1 id="title">EPC 에어컨 장애신고 현황</h1>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="kpis">
      <span class="kpi"><i style="background:var(--st-new)"></i>접수 <b id="kNew">0</b></span>
      <span class="kpi"><i style="background:var(--st-doing)"></i>처리중 <b id="kDoing">0</b></span>
      <span class="kpi"><i style="background:var(--st-hold)"></i>보류 <b id="kHold">0</b></span>
      <span class="kpi"><i style="background:var(--st-done)"></i>24시간 내 완료 <b id="kDone">0</b></span>
    </div>
    <div class="spacer"></div>
    <span class="meta" id="updated"></span>
    <button class="btn sm" id="btnRefresh">새로고침</button>
    <button class="btn sm" id="btnAdmin">관리자</button>
  </div>
  <div class="body">
    <div id="map"></div>
    <aside class="side">
      <h2 id="sideTitle">진행 중인 신고</h2>
      <div class="list" id="openList"></div>
      <div class="adm hidden" id="admBar">
        <div class="legend"><b>관리자 모드</b></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm" id="btnPanelReports">신고 처리</button>
          <button class="btn sm" id="btnPanelPlace">위치 배치</button>
          <button class="btn sm" id="btnLabels">QR 라벨 인쇄</button>
          <button class="btn sm" id="btnLogout">나가기</button>
        </div>
      </div>
    </aside>
  </div>
  <div class="legend">
    <span><i style="background:var(--st-ok)"></i>정상</span>
    <span><i style="background:var(--st-new)"></i>접수(미처리)</span>
    <span><i style="background:var(--st-doing)"></i>처리중</span>
    <span><i style="background:var(--st-hold)"></i>보류</span>
    <span><i style="background:var(--st-done)"></i>24시간 내 완료</span>
  </div>
</div>

<!-- ================= 장애신고 (QR) ================= -->
<div id="report" class="hidden">
  <div class="rhead">
    <span class="brand" data-t="brand"></span>
    <span class="lang"><button id="lgVi" aria-pressed="false">VI</button><button id="lgKo" aria-pressed="false">KO</button></span>
  </div>
  <div id="rBody"></div>
</div>

<div id="labels"></div>

<script>
const P = <?!= params ?>;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
function toast(m){ let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.append(t);} t.textContent=m; clearTimeout(t._h); t._h=setTimeout(()=>t.remove(),2600); }
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const STATUS_COLOR = {'접수':'var(--st-new)','처리중':'var(--st-doing)','보류':'var(--st-hold)','완료':'var(--st-done)'};
const imgCache = {};
async function floorImage(floor){ if (!imgCache[floor]) imgCache[floor] = call('getFloorImage', floor); return imgCache[floor]; }
function imgSize(url){ return new Promise(r => { const i = new Image(); i.onload = () => r([i.naturalWidth, i.naturalHeight]); i.onerror = () => r([1600,800]); i.src = url; }); }

/* =================================================================
   장애신고 화면 (QR 스캔으로 진입)
   ================================================================= */
const SYM = [
  ['냉방 안 됨','Không mát'], ['전원 안 켜짐','Không lên nguồn'], ['물 떨어짐','Chảy nước'], ['소음·진동','Tiếng ồn, rung'],
  ['냄새','Có mùi'], ['에러 표시·깜박임','Báo lỗi, đèn nháy'], ['리모컨·제어 이상','Lỗi điều khiển'], ['기타','Khác']
];
const T = {
  ko:{brand:'EPC 에어컨 장애신고', loc:'위치', floor:'층', open:'이미 신고되어 처리 중입니다', openMore:'같은 문제라면 다시 신고하지 않아도 됩니다. 다른 문제라면 아래에서 신고하세요.',
      sym:'어떤 문제인가요?', symMulti:'(여러 개 선택 가능)', deptPick:'부서를 고르세요', deptOther:'기타 (직접 입력)', detail:'자세한 내용', opt:'(선택)', name:'이름', dept:'부서', phone:'연락처', photo:'사진', photoBtn:'사진 찍기 / 선택',
      submit:'신고하기', sending:'보내는 중…', need:'증상을 하나 이상 고르고 이름과 부서를 입력하세요.', done:'신고가 접수되었습니다', doneSub:'공무팀에 바로 알렸습니다. 아래 번호로 문의할 수 있습니다.',
      again:'다른 문제 신고하기', notFound:'등록되지 않은 에어컨 번호입니다', notFoundSub:'라벨의 번호를 공무팀에 알려 주세요.', fail:'보내지 못했습니다. 다시 눌러 주세요.', status:{접수:'접수',처리중:'처리중',보류:'보류'}},
  vi:{brand:'Báo hỏng điều hòa EPC', loc:'Vị trí', floor:'Tầng', open:'Máy này đã được báo hỏng và đang xử lý', openMore:'Nếu cùng sự cố, không cần báo lại. Nếu khác, hãy báo bên dưới.',
      sym:'Sự cố là gì?', symMulti:'(có thể chọn nhiều)', deptPick:'Chọn bộ phận', deptOther:'Khác (tự nhập)', detail:'Mô tả thêm', opt:'(không bắt buộc)', name:'Họ tên', dept:'Bộ phận', phone:'Số điện thoại', photo:'Ảnh', photoBtn:'Chụp / chọn ảnh',
      submit:'Gửi báo hỏng', sending:'Đang gửi…', need:'Hãy chọn ít nhất một sự cố và nhập họ tên, bộ phận.', done:'Đã nhận báo hỏng', doneSub:'Đã thông báo ngay cho Phòng Công vụ. Có thể hỏi lại bằng mã dưới đây.',
      again:'Báo sự cố khác', notFound:'Mã điều hòa chưa được đăng ký', notFoundSub:'Hãy báo mã trên tem cho Phòng Công vụ.', fail:'Gửi không thành công. Hãy bấm lại.', status:{접수:'Đã nhận',처리중:'Đang xử lý',보류:'Tạm hoãn'}}
};
let lang = lsGet('ac_lang') || ((navigator.language||'').toLowerCase().startsWith('ko') ? 'ko' : 'vi');
let RU = null, rSym = new Set(), rPhoto = '';

async function startReport(){
  $('report').classList.remove('hidden');
  $('lgVi').onclick = () => setLang('vi'); $('lgKo').onclick = () => setLang('ko');
  $('rBody').innerHTML = '<div class="card">…</div>';
  try { RU = await call('getUnit', P.ac); } catch(e){ RU = {found:false, code:P.ac}; }
  setLang(lang);
}
function setLang(l){ lang=l; lsSet('ac_lang',l); $('lgVi').setAttribute('aria-pressed', l==='vi'); $('lgKo').setAttribute('aria-pressed', l==='ko'); renderReport(); }
function tt(k){ return T[lang][k]; }
function deptField(){
  const list = (RU && RU.depts && RU.depts.length) ? RU.depts : [];
  const last = lsGet('ac_dept') || '';
  const inList = list.indexOf(last) >= 0;
  const opts = [`<option value="">${tt('deptPick')}</option>`]
    .concat(list.map(d => `<option value="${esc(d)}"${d===last?' selected':''}>${esc(d)}</option>`))
    .concat([`<option value="__other"${(!inList && last)?' selected':''}>${tt('deptOther')}</option>`]);
  return `<select id="fDeptSel">${opts.join('')}</select><input id="fDept" class="${(!inList && last)?'':'hidden'}" placeholder="${tt('deptOther')}" value="${(!inList && last)?esc(last):''}">`;
}
function symText(ko){ return String(ko||'').split(/\s*,\s*/).map(k => { const s=SYM.find(x=>x[0]===k); return s ? (lang==='vi'? s[1] : s[0]) : k; }).join(', '); }

function renderReport(){
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = tt(n.dataset.t));
  if (!RU) return;
  const b = $('rBody');
  if (!RU.found){
    b.innerHTML = `<div class="unit"><div class="code">${esc(RU.code||'—')}</div><div><b>${tt('notFound')}</b></div><div class="sub">${tt('notFoundSub')}</div></div>`;
    return;
  }
  const u = RU.unit;
  b.innerHTML = `
  <div class="unit">
    <div class="code">${esc(u.code)}</div>
    <div class="sub">${tt('floor')} ${esc(u.floor)}${u.loc ? ' · ' + esc(u.loc) : ''}</div>
    ${u.x!=null ? '<div id="mini"></div>' : ''}
  </div>
  ${RU.open.length ? `<div class="warn"><b>${tt('open')}</b><br>${RU.open.map(o=>`· ${esc(symText(o.symptom))} – ${esc(tt('status')[o.status]||o.status)} (${esc(o.at)})`).join('<br>')}<br><span style="color:#7a5a20">${tt('openMore')}</span></div>` : ''}
  <form class="card" id="rForm" novalidate>
    <h3>${tt('sym')} <small style="font-weight:400;color:var(--muted)">${tt('symMulti')}</small></h3>
    <div class="sym">${SYM.map((s,i)=>`<button type="button" data-i="${i}" aria-pressed="${rSym.has(i)}">${esc(lang==='vi'? s[1] : s[0])}${lang==='vi'?`<br><small style="font-weight:400;color:var(--muted)">${esc(s[0])}</small>`:''}</button>`).join('')}</div>
    <div class="fld"><label for="fDetail">${tt('detail')} <span class="opt">${tt('opt')}</span></label><textarea id="fDetail"></textarea></div>
    <div class="fld"><label for="fName">${tt('name')}</label><input id="fName" autocomplete="name" value="${esc(lsGet('ac_name')||'')}"></div>
    <div class="fld"><label for="fDeptSel">${tt('dept')}</label>${deptField()}</div>
    <div class="fld"><label for="fPhone">${tt('phone')} <span class="opt">${tt('opt')}</span></label><input id="fPhone" type="tel" inputmode="tel" value="${esc(lsGet('ac_phone')||'')}"></div>
    <div class="fld photo"><label>${tt('photo')} <span class="opt">${tt('opt')}</span></label>
      <input id="fPhoto" type="file" accept="image/*" capture="environment" class="hidden">
      <button type="button" class="btn" id="btnPhoto">${tt('photoBtn')}</button>
      <img id="pv" class="${rPhoto?'':'hidden'}" src="${rPhoto}" alt="">
    </div>
    <div class="err hidden" id="rErr"></div>
    <button type="submit" class="btn primary submit" id="btnSend">${tt('submit')}</button>
  </form>`;
  b.querySelectorAll('.sym button').forEach(x => x.onclick = () => { const i = +x.dataset.i; if (rSym.has(i)) rSym.delete(i); else rSym.add(i); x.setAttribute('aria-pressed', rSym.has(i)); });
  $('fDeptSel').onchange = () => { $('fDept').classList.toggle('hidden', $('fDeptSel').value !== '__other'); if ($('fDeptSel').value === '__other') $('fDept').focus(); };
  $('btnPhoto').onclick = () => $('fPhoto').click();
  $('fPhoto').onchange = e => { const f=e.target.files[0]; if(f) shrink(f).then(d=>{ rPhoto=d; $('pv').src=d; $('pv').classList.remove('hidden'); }); };
  $('rForm').onsubmit = sendReport;
  if (u.x != null) miniMap(u);
}
function shrink(file){
  return new Promise(res => { const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=1280, s=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.8)); }; im.src=fr.result; }; fr.readAsDataURL(file); });
}
async function miniMap(u){
  const url = await floorImage(u.floor); if (!url || !$('mini')) return;
  const [w,h] = await imgSize(url);
  const m = L.map('mini',{crs:L.CRS.Simple, zoomControl:false, attributionControl:false, minZoom:-3, maxZoom:2});
  const bounds=[[0,0],[h,w]]; L.imageOverlay(url,bounds).addTo(m);
  const ll=[h-u.y*h, u.x*w];
  L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="mk alert"><span class="sq" style="background:var(--st-new)"></span><span class="mkl" style="background:var(--st-new)">${esc(u.code.split('-').pop())}</span></div>`,iconSize:null,iconAnchor:[7,7]})}).addTo(m);
  m.fitBounds(bounds); m.setView(ll, Math.min(m.getZoom()+1.5, 1));
}
async function sendReport(e){
  e.preventDefault();
  const sel=$('fDeptSel').value, name=$('fName').value.trim(), phone=$('fPhone').value.trim();
  const dept = sel === '__other' ? $('fDept').value.trim() : sel;
  if (!rSym.size || !name || !dept){ $('rErr').textContent=tt('need'); $('rErr').classList.remove('hidden'); return; }
  lsSet('ac_name',name); lsSet('ac_dept',dept); lsSet('ac_phone',phone);
  const btn=$('btnSend'); btn.disabled=true; btn.textContent=tt('sending');
  try{
    const r = await call('submitReport',{code:RU.unit.code, symptom:[...rSym].sort((a,b)=>a-b).map(i=>SYM[i][0]).join(', '), detail:$('fDetail').value.trim(), name, dept, phone, photo:rPhoto});
    rSym=new Set(); rPhoto='';
    $('rBody').innerHTML = `<div class="card done"><div class="ok">✓</div><h3>${tt('done')}</h3><div class="rid">${esc(r.id)}</div><div class="sub">${tt('doneSub')}</div><button class="btn" id="btnAgain">${tt('again')}</button></div>`;
    $('btnAgain').onclick = async () => { RU = await call('getUnit', RU.unit.code); renderReport(); };
  }catch(err){
    btn.disabled=false; btn.textContent=tt('submit');
    $('rErr').textContent = tt('fail') + ' ' + (err && err.message ? err.message : ''); $('rErr').classList.remove('hidden');
  }
}

/* =================================================================
   현황판
   ================================================================= */
let D = null, curFloor = null, map = null, overlay = null, layer = null, markers = {}, imgWH = {};
let token = null, adminPanel = 'reports', placeSel = null, adminData = [];

async function startDash(){
  $('dash').classList.remove('hidden');
  $('btnRefresh').onclick = () => refresh(true);
  $('btnAdmin').onclick = openLogin;
  $('btnLogout').onclick = () => { token=null; try{sessionStorage.removeItem('ac_tok');}catch(e){} setAdmin(false); };
  $('btnPanelReports').onclick = () => { adminPanel='reports'; renderSide(); renderMarkers(); };
  $('btnPanelPlace').onclick = () => { adminPanel='place'; renderSide(); renderMarkers(); };
  $('btnLabels').onclick = printLabels;
  map = L.map('map',{crs:L.CRS.Simple, minZoom:-3, maxZoom:3, zoomSnap:0.25, attributionControl:false});
  map.on('click', onMapClick);
  layer = L.layerGroup().addTo(map);
  try{ token = sessionStorage.getItem('ac_tok'); }catch(e){}
  await refresh(false);
  if (token) setAdmin(true);
  else if (P.view === 'admin') openLogin();
  setInterval(() => refresh(false), 60000);
}

async function refresh(manual){
  try{
    D = await call('getBootstrap');
    $('title').textContent = (D.title || 'EPC 에어컨 장애신고') + ' 현황';
    $('updated').textContent = '갱신 ' + D.now;
    if (!curFloor) curFloor = (D.floors[0] || {}).floor;
    renderTabs(); await showFloor(curFloor, false); renderKpis();
    if (token) await loadAdmin();
    renderSide(); renderMarkers();
    if (manual) toast('새로 고쳤습니다');
  }catch(e){ toast('불러오지 못했습니다: ' + (e.message||e)); }
}
function renderTabs(){
  $('tabs').innerHTML = D.floors.map(f => `<button class="tab" role="tab" aria-selected="${f.floor===curFloor}" data-f="${esc(f.floor)}">${esc(f.name)}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { curFloor=b.dataset.f; placeSel=null; renderTabs(); showFloor(curFloor,true).then(()=>{renderSide();renderMarkers();}); });
}
async function showFloor(floor, fit){
  if (!floor) return;
  if (overlay && overlay._floor === floor && !fit) return;
  const url = await floorImage(floor);
  const [w,h] = url ? await imgSize(url) : [1600,800];
  imgWH[floor] = [w,h];
  if (overlay) map.removeLayer(overlay);
  if (url){ overlay = L.imageOverlay(url, [[0,0],[h,w]]).addTo(map); overlay._floor = floor; }
  map.fitBounds([[0,0],[h,w]]);
}
function unitStatus(code){
  const rs = D.open.filter(o => o.code === code);
  for (const s of ['접수','처리중','보류']) if (rs.some(r => r.status === s)) return s;
  if (rs.some(r => r.status === '완료')) return '완료';
  return '정상';
}
function renderKpis(){
  const c = s => D.open.filter(o => o.status === s).length;
  $('kNew').textContent=c('접수'); $('kDoing').textContent=c('처리중'); $('kHold').textContent=c('보류'); $('kDone').textContent=c('완료');
}
function renderMarkers(){
  layer.clearLayers(); markers = {};
  const [w,h] = imgWH[curFloor] || [1600,800];
  const placing = token && adminPanel === 'place';
  D.units.filter(u => u.floor === curFloor && u.x != null).forEach(u => {
    const st = unitStatus(u.code), col = STATUS_COLOR[st] || 'var(--st-ok)';
    const html = `<div class="mk${st==='접수'?' alert':''}"><span class="sq" style="background:${col}"></span><span class="mkl" style="background:${col}">${esc(u.code.split('-').pop())}</span></div>`;
    const m = L.marker([h - u.y*h, u.x*w], {icon:L.divIcon({className:'',html,iconSize:null,iconAnchor:[7,7]}), draggable: !!placing, keyboard:true, title:u.code}).addTo(layer);
    m.on('click', () => { if (!placing) m.bindPopup(popupHtml(u, st)).openPopup(); });
    m.on('dragend', async ev => { const ll=ev.target.getLatLng(); const x=ll.lng/w, y=(h-ll.lat)/h; u.x=x; u.y=y; try{ await call('adminSavePosition', token, u.code, x, y); toast(u.code+' 위치 저장'); }catch(e){ toast(e.message||String(e)); } });
    markers[u.code] = m;
  });
}
function popupHtml(u, st){
  const rs = D.open.filter(o => o.code === u.code);
  return `<div class="pop"><h3>${esc(u.code)}</h3><div>${esc(u.loc||'')}</div>
    ${rs.length ? rs.map(r=>`<div class="rp"><span class="pill st-${esc(r.status)}">${esc(r.status)}</span> ${esc(r.symptom)} <small>${esc(r.at)}</small></div>`).join('') : '<div class="rp">신고 없음 (정상)</div>'}
    <div style="margin-top:6px"><a href="${esc(reportBase())}?ac=${encodeURIComponent(u.code)}" target="_blank">신고 화면 열기</a></div></div>`;
}
function focusUnit(code){
  const u = D.units.find(x => x.code === code); if (!u) return;
  const go = () => { const m = markers[code]; if (m){ map.setView(m.getLatLng(), Math.max(map.getZoom(), 0)); m.fire('click'); } };
  if (u.floor !== curFloor){ curFloor=u.floor; renderTabs(); showFloor(curFloor,true).then(()=>{renderSide();renderMarkers();go();}); } else go();
}
function renderSide(){
  const list = $('openList');
  if (token && adminPanel === 'reports') return renderAdminReports();
  if (token && adminPanel === 'place') return renderPlace();
  $('sideTitle').textContent = '진행 중인 신고';
  const rs = D.open.filter(o => o.status !== '완료').sort((a,b)=> a.at < b.at ? 1 : -1);
  list.innerHTML = rs.length ? rs.map(r => `<div class="item" data-c="${esc(r.code)}"><div class="r1"><span class="code">${esc(r.code)}</span><span class="pill st-${esc(r.status)}">${esc(r.status)}</span></div><div class="r2">${esc(r.symptom)} · ${esc(r.at)}</div></div>`).join('') : '<div class="empty">진행 중인 신고가 없습니다.</div>';
  list.querySelectorAll('.item').forEach(n => n.onclick = () => focusUnit(n.dataset.c));
}

/* ---------- 관리자 ---------- */
function openLogin(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<form class="box"><b>관리자 접속</b><input id="admCode" type="password" inputmode="numeric" placeholder="관리자 코드" autocomplete="off"><div class="err" id="admErr"></div><div style="display:flex;gap:6px;justify-content:flex-end"><button type="button" class="btn" id="admCancel">취소</button><button class="btn primary">접속</button></div></form>`;
  document.body.append(m); $('admCode').focus();
  $('admCancel').onclick = () => m.remove();
  m.querySelector('form').onsubmit = async e => { e.preventDefault(); try{ const r=await call('adminLogin',$('admCode').value); token=r.token; try{sessionStorage.setItem('ac_tok',token);}catch(x){} m.remove(); setAdmin(true); }catch(err){ $('admErr').textContent = err.message || '접속 실패'; } };
}
async function setAdmin(on){
  $('admBar').classList.toggle('hidden', !on); $('btnAdmin').classList.toggle('hidden', on);
  if (on){ try{ await loadAdmin(); }catch(e){ token=null; setAdmin(false); toast(e.message||String(e)); return; } }
  renderSide(); renderMarkers();
}
async function loadAdmin(){ adminData = await call('adminReports', token, 30); }
function renderAdminReports(){
  $('sideTitle').textContent = '신고 처리 (최근 30일)';
  const list=$('openList');
  const rs = adminData.filter(r => (D.units.find(u=>u.code===r.code)||{}).floor === curFloor || r.floor === curFloor);
  if (!rs.length){ list.innerHTML='<div class="empty">이 층의 신고가 없습니다.</div>'; return; }
  list.innerHTML = rs.map(r => `<div class="rep" data-id="${esc(r.id)}">
    <div class="hd"><span><b class="code" style="font-family:var(--mono)">${esc(r.code)}</b> <small>${esc(r.id)}</small></span><span class="pill st-${esc(r.status)}">${esc(r.status)}</span></div>
    <div class="tx"><b>${esc(r.symptom)}</b>${r.detail?` – ${esc(r.detail)}`:''}<br><small>${esc(r.at)} · ${esc(r.name)} / ${esc(r.dept)}${r.phone?' · '+esc(r.phone):''}${r.done?' · 완료 '+esc(r.done):''}</small></div>
    <div class="ctl">${['접수','처리중','보류','완료','취소'].map(s=>`<button type="button" class="btn sm stbtn" data-s="${s}" aria-pressed="${r.status===s}">${s}</button>`).join('')}
      ${r.photo?'<button type="button" class="btn sm" data-ph="1">사진</button>':''}<button type="button" class="btn sm" data-go="1">위치</button></div>
    <input placeholder="담당자" value="${esc(r.assignee||'')}" data-f="assignee">
    <textarea placeholder="조치 내용" data-f="action">${esc(r.action||'')}</textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:4px"><button type="button" class="btn sm primary" data-save="1">저장</button></div>
  </div>`).join('');
  list.querySelectorAll('.rep').forEach(box => {
    const id = box.dataset.id, r = adminData.find(x=>x.id===id); let st = r.status;
    box.querySelectorAll('.stbtn').forEach(b => b.onclick = () => { st=b.dataset.s; box.querySelectorAll('.stbtn').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
    box.querySelector('[data-go]').onclick = () => focusUnit(r.code);
    const ph = box.querySelector('[data-ph]'); if (ph) ph.onclick = async () => { const d = await call('adminPhoto', token, id); if(d){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box" style="width:min(720px,100%)"><img src="${d}" style="max-width:100%"><button class="btn">닫기</button></div>`; m.onclick=()=>m.remove(); document.body.append(m);} };
    box.querySelector('[data-save]').onclick = async ev => {
      ev.target.disabled = true;
      try{ await call('adminUpdateReport', token, id, {status:st, assignee:box.querySelector('[data-f=assignee]').value, action:box.querySelector('[data-f=action]').value}); toast(id+' 저장했습니다'); await refresh(false); }
      catch(e){ toast(e.message||String(e)); ev.target.disabled=false; }
    };
  });
}
function renderPlace(){
  $('sideTitle').textContent = '위치 배치';
  const us = D.units.filter(u => u.floor === curFloor);
  const un = us.filter(u => u.x == null), pl = us.filter(u => u.x != null);
  $('openList').innerHTML = `<div class="place">
    <p style="margin:4px 2px 10px;color:var(--muted)">미배치 번호를 고른 뒤 도면에서 위치를 누르세요. 배치된 표시는 끌어서 옮기면 바로 저장됩니다.</p>
    <b>미배치 ${un.length}</b><div>${un.map(u=>`<span class="chip${placeSel===u.code?' sel':''}" data-c="${esc(u.code)}">${esc(u.code.split('-').pop())}</span>`).join('') || '<span class="meta">없음</span>'}</div>
    <div style="margin-top:12px"><b>배치됨 ${pl.length}</b></div><div>${pl.map(u=>`<span class="chip" data-p="${esc(u.code)}">${esc(u.code.split('-').pop())}</span>`).join('')}</div>
    ${placeSel?`<p style="margin-top:10px"><b>${esc(placeSel)}</b> 선택됨 – 도면을 누르세요</p>`:''}
  </div>`;
  $('openList').querySelectorAll('[data-c]').forEach(c => c.onclick = () => { placeSel = placeSel===c.dataset.c ? null : c.dataset.c; renderPlace(); });
  $('openList').querySelectorAll('[data-p]').forEach(c => c.onclick = () => { const m = markers[c.dataset.p]; if (m) map.setView(m.getLatLng(), Math.max(map.getZoom(),0)); });
}
async function onMapClick(ev){
  if (!(token && adminPanel === 'place' && placeSel)) return;
  const [w,h] = imgWH[curFloor]; const x = ev.latlng.lng/w, y = (h-ev.latlng.lat)/h;
  if (x<0||x>1||y<0||y>1) return;
  const u = D.units.find(z => z.code === placeSel); u.x=x; u.y=y; const code=placeSel; placeSel=null;
  renderMarkers(); renderPlace();
  try{ await call('adminSavePosition', token, code, x, y); toast(code+' 배치 저장'); }catch(e){ toast(e.message||String(e)); }
}

/* ---------- QR 라벨 인쇄 ---------- */
function reportBase(){ return (P.reportUrl || P.url).replace(/[?#].*$/,''); }
function qrImg(text){ const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createDataURL(8, 0); }
function printLabels(){
  const us = D.units.filter(u => u.floor === curFloor).sort((a,b)=>a.code.localeCompare(b.code));
  if (!us.length){ toast('이 층에 에어컨이 없습니다'); return; }
  if (!P.reportUrl && !confirmBox_()) return;
  const pages=[];
  for (let i=0;i<us.length;i+=5){
    pages.push('<div class="page">' + us.slice(i,i+5).map(u => {
      const p=u.code.split('-'); const pre=p.slice(0,2).join('-'), num=p.slice(2).join('-');
      return `<div class="lb"><div class="pre"><span class="t">EPC · AC</span><span class="p">${esc(pre)}</span></div><div class="num">${esc(num)}</div><div class="q"><img alt="" src="${qrImg(reportBase()+'?ac='+encodeURIComponent(u.code))}"><span>${esc(u.code)}</span></div></div>`;
    }).join('') + '</div>');
  }
  $('labels').innerHTML = pages.join('');
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); }, 300);
}

function confirmBox_(){ toast('Config의 REPORT_URL(외부 신고 페이지 주소)이 비어 있어 웹앱 주소로 출력합니다'); return true; }

/* ---------- 시작 ---------- */
if (P.ac) startReport(); else startDash();
</script>
